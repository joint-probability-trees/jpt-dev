name: Run tests and build the Python distribution

on:
  push:
    branches:
      - main

  pull_request:

  # ------------------------------------------------------------------------------------------------------------------

  workflow_call:
    inputs:
      version:
        required: true
        type: string

      python-versions:
        required: true
        type: string
        default: "cp311-cp311"

# --------------------------------------------------------------------------------------------------------------------

defaults:
  run:
    shell: bash
    working-directory: .

# --------------------------------------------------------------------------------------------------------------------

concurrency:
  group: 'jpt-building-and-deployment-${{ github.ref }}'
  cancel-in-progress: true

# --------------------------------------------------------------------------------------------------------------------

jobs:
  test-and-build:
    name: Build and Test the Python distribution (Linux)
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------------------------------------------------------------------

      - name: Setup python
        uses: actions/setup-python@v5
        with:
            python-version: "3.11"
            cache: pip

      # ----------------------------------------------------------------------------------------------------------------

      - name: Setup Graphviz
        uses: ts-graphviz/setup-graphviz@v1

      # ----------------------------------------------------------------------------------------------------------------

      - name: Install dependencies
        # CI-only constraints until the code base supports them: pandas 3 (str dtype /
        # copy-on-write) and plotly >= 6.1 (needs kaleido >= 1, while kaleido < 1 is pinned).
        run: pip install -e ".[dev]" "pandas<3" "plotly<6.1"

      # ----------------------------------------------------------------------------------------------------------------

      - name: Run Tests
        working-directory: tests
        run: python -m unittest discover -s test -t .

      # ----------------------------------------------------------------------------------------------------------------

      - name: Build binary wheels
        uses: RalfG/python-wheels-manylinux-build@v0.7.1
        with:
          python-versions: ${{ inputs.python-versions || 'cp311-cp311' }}
          build-requirements: 'cython numpy setuptools-scm'
          pip-wheel-args: '-w ./dist-raw --no-deps'
          # Git 2.35.2+ refuses to operate on repositories whose
          # on-disk ownership differs from the running user
          # ("dubious ownership" safety check). Inside the
          # manylinux container the bind-mounted /github/workspace
          # hits this check, which in turn breaks version
          # derivation by setuptools-scm / vcs-versioning. Mark
          # the workspace as safe before the wheel build runs.
          pre-build-command: 'git config --global --add safe.directory /github/workspace'

      # ----------------------------------------------------------------------------------------------------------------

      - name: Install pandoc
        run: sudo apt-get install -y pandoc

      # ----------------------------------------------------------------------------------------------------------------

      - name: Build Sphinx documentation
        working-directory: ./doc
        run: make html

      # ----------------------------------------------------------------------------------------------------------------

      - name: Make wheel available
        id: wheel_url
        uses: actions/upload-artifact@v4
        with:
          name: pyjpt-wheel-linux
          path: dist-raw/*manylinux*.whl

  # --------------------------------------------------------------------------------------------------------------------

  test-and-build-windows:
    name: Build and Test the Python distribution (Windows)
    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------------------------------------------------------------------

      - name: Setup python
        uses: actions/setup-python@v5
        with:
            python-version: "3.11"
            cache: pip

      # ----------------------------------------------------------------------------------------------------------------

      - name: Setup Graphviz
        uses: ts-graphviz/setup-graphviz@v2

      # ----------------------------------------------------------------------------------------------------------------

      # Compiles the Cython extensions with MSVC.
      - name: Install dependencies
        # CI-only constraints until the code base supports them: pandas 3 (str dtype /
        # copy-on-write) and plotly >= 6.1 (needs kaleido >= 1, while kaleido < 1 is pinned).
        run: pip install -e ".[dev]" "pandas<3" "plotly<6.1"

      # ----------------------------------------------------------------------------------------------------------------

      # Verbose output and a faulthandler watchdog: if the suite hangs, dump the stacks of all
      # threads after 20 minutes and exit, instead of blocking until the 6 hour job limit.
      - name: Run Tests
        working-directory: tests
        timeout-minutes: 30
        env:
          MPLBACKEND: Agg
        run: >-
          python -c "import faulthandler, unittest;
          faulthandler.dump_traceback_later(1200, exit=True);
          unittest.main(module=None, argv=['unittest', 'discover', '-v', '-s', 'test', '-t', '.'])"

      # ----------------------------------------------------------------------------------------------------------------

      # cibuildwheel expects build selectors such as "cp311-*" instead of the "cp311-cp311"
      # tags used by the manylinux build above.
      - name: Translate Python versions for cibuildwheel
        run: |
          versions="${{ inputs.python-versions || 'cp311-cp311' }}"
          echo "CIBW_BUILD=$(echo "$versions" | sed -E 's/(cp[0-9]+)-cp[0-9]+/\1-*/g')" >> "$GITHUB_ENV"

      - name: Build binary wheels
        uses: pypa/cibuildwheel@v3.4.1
        with:
          output-dir: dist-raw
        env:
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_BUILD_VERBOSITY: 1
          CIBW_TEST_COMMAND: >-
            python -c "import jpt, jpt.trees, jpt.learning.impurity; print(jpt.__version__)"

      # ----------------------------------------------------------------------------------------------------------------

      - name: Make wheel available
        uses: actions/upload-artifact@v4
        with:
          name: pyjpt-wheel-windows
          path: dist-raw/*.whl
